            type: array
            items:
              $ref: '#/definitions/models.SemaforoTable'
        '400':
          description: '{object} models.APIResponse "Parámetro ''cedula'' es obligatorio"'
        '404':
          description: '{object} models.APIResponse "No se encontraron proyectos asignados"'
        '503':
          description: '{object} models.APIResponse "Error al consultar el servicio externo"'
