      - semaforo
      description: obtener todos los estudiantes con filtros opcionales
      operationId: SemaforoController.ObtenerEstudiantes
      parameters:
      - in: query
        name: limit
        description: Número de registros por página
        type: integer
        format: int64
      - in: query
        name: offset
        description: Número de registros a saltar
        type: integer
        format: int64
      - in: query
        name: codigo
        description: Código del estudiante
        type: string
      - in: query
        name: idFacultad
        description: ID de la facultad
        type: integer
        format: int64
      - in: query
        name: idProyecto
        description: ID del proyecto curricular
        type: integer
        format: int64
      - in: query
        name: anio
        description: Año de inscripción
        type: integer
        format: int64
      - in: query
        name: periodo
        description: Periodo de inscripción
        type: integer
        format: int64
      responses:
        '200':
          description: ''
          schema:
            type: array
            items:
              $ref: '#/definitions/models.SemaforoTable'
        '503':
          description: ''
