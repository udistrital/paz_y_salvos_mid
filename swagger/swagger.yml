        name: cedula
        description: Cédula del asistente
        required: true
        type: string
      - in: query
        name: limit
        description: Número de registros por página
        type: integer
        format: int64
      - in: query
        name: offset
        description: Número de registros a saltar
        type: integer
        format: int64
      - in: query
        name: codigo
        description: Código del estudiante
        type: string
      - in: query
        name: idProyecto
        description: ID del proyecto Oikos
        type: integer
        format: int64
      - in: query
        name: anio
        description: Año de inscripción
        type: integer
        format: int64
      - in: query
        name: periodo
        description: Periodo de inscripción
        type: integer
        format: int64
